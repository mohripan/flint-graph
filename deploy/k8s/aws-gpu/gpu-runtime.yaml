# k3s adds this container runtime by itself when it finds NVIDIA's toolkit on the server. There is
# one GPU and everything on that server shares it, so pods reach it with NVIDIA_VISIBLE_DEVICES
# rather than through a device plugin, which would give the whole GPU to one pod.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: nvidia
handler: nvidia
