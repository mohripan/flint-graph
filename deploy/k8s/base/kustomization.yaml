apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: flintgraph
resources:
  - namespace.yaml
  - network-policy.yaml
  - postgres.yaml
  - temporal.yaml
  - minio.yaml
  - api.yaml
  - frontend.yaml
  - studio-workers.yaml
configMapGenerator:
  - name: flintgraph-config
    envs:
      - config.env
  # The exact bytes their pins hash: only these name the models here. The weights are on Runpod.
  - name: model-manifests
    files:
      - model-manifests/animagine-xl-4.0.json
      - model-manifests/anime-seg.json
      - model-manifests/ip-adapter.json
      - model-manifests/kokoro-82m.json
