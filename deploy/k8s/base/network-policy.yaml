# The GPU server's role can read the cluster's join token, and the instance metadata address hands
# it to anything that asks. No pod needs it: the controller has its own key.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: no-instance-role
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: [169.254.169.254/32]
