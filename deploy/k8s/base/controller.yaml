# Starts and stops the GPU server. Lightsail has no instance role, so this uses a key that can do
# little else, in a Secret that no other pod is given.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-controller
spec:
  # Off at first: while the GPU server is being set up it has no workers, and this would stop it
  # as silent. docs/runbooks/aws-deployment.md turns this on as the last step.
  replicas: 0
  selector:
    matchLabels:
      app: gpu-controller
  template:
    metadata:
      labels:
        app: gpu-controller
    spec:
      automountServiceAccountToken: false
      containers:
        - name: controller
          image: ghcr.io/mohripan/flint-graph-api:unset
          command: [python, -m, flint_graph.processes.narrative_gpu_controller]
          env:
            - name: FLINT_GRAPH_NARRATIVE_GPU_CONTROLLER_ENABLED
              value: "true"
          envFrom:
            - configMapRef:
                name: flintgraph-config
            - secretRef:
                name: flintgraph-env
            - secretRef:
                name: flintgraph-aws
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              memory: 384Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
