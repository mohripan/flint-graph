apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: flintgraph
resources:
  - ../base
  - ingress.yaml
configMapGenerator:
  - name: flintgraph-config
    behavior: merge
    envs:
      - config.env
# After running the deploy-images workflow, put the commit it built here. See the runbook.
images:
  - name: ghcr.io/mohripan/flint-graph-api
    newTag: 35d315de03912b8fe849ddcdb47c01dedbb628cd
  - name: ghcr.io/mohripan/flint-graph-frontend
    newTag: a819bc6d1896101eb534864fc0c5dfb945a5861b
  - name: ghcr.io/mohripan/flint-graph-playtest
    newTag: 99672e16704b0491308bc8e98ec3557ec0883eaa
