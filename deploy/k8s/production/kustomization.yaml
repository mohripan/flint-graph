apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: flintgraph
resources:
  - ../base
  - ingress.yaml
configMapGenerator:
  - name: flintgraph-config
    behavior: merge
    envs:
      - config.env
# After running the deploy-images workflow, put the commit it built here. See the runbook.
images:
  - name: ghcr.io/mohripan/flint-graph-api
    newTag: 3d5c1cc8b5e4b85466f58e92f849f43fa955a7c9
  - name: ghcr.io/mohripan/flint-graph-frontend
    newTag: 3d5c1cc8b5e4b85466f58e92f849f43fa955a7c9
  - name: ghcr.io/mohripan/flint-graph-gpu-worker
    newTag: 3d5c1cc8b5e4b85466f58e92f849f43fa955a7c9
