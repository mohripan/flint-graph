apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: studio
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  tls:
    - hosts: [flintgraph.digital, 54-253-96-189.sslip.io]
  rules:
    - host: flintgraph.digital
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
          # The page checks this one. The rest of /health and the API's docs stay inside the cluster.
          - path: /health/live
            pathType: Exact
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
    - host: 54-253-96-189.sslip.io
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
          # The page checks this one. The rest of /health and the API's docs stay inside the cluster.
          - path: /health/live
            pathType: Exact
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
---
# Playtests, on an address of their own so that a story cannot reach the signed-in site. The frontend
# and the playtest image each have the other's address written into them when they are built.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: playtest
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  tls:
    - hosts: [play.54-253-96-189.sslip.io]
  rules:
    - host: play.54-253-96-189.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: playtest
                port:
                  number: 80
