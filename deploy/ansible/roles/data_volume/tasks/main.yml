---
# The database, the files and Temporal live here. It must never be formatted twice.
- name: Find the data disk by its volume ID
  ansible.builtin.set_fact:
    data_device: "/dev/disk/by-id/nvme-Amazon_Elastic_Block_Store_{{ flintgraph_data_volume | replace('-', '') }}"

- name: Wait for the data disk to attach
  ansible.builtin.wait_for:
    path: "{{ data_device }}"
    timeout: 300

- name: Check whether the disk already has a filesystem
  ansible.builtin.command: "blkid -o value -s TYPE {{ data_device }}"
  register: data_filesystem
  changed_when: false
  failed_when: data_filesystem.rc not in [0, 2]

- name: Format the disk only if it is blank
  ansible.builtin.command: "mkfs.ext4 -L flintgraph-data {{ data_device }}"
  when: data_filesystem.stdout | trim == ''
  changed_when: true

- name: Create the mount point
  ansible.builtin.file:
    path: "{{ flintgraph_data_dir }}"
    state: directory
    mode: "0755"

- name: Mount the data disk at each boot
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: "LABEL=flintgraph-data {{ flintgraph_data_dir }} ext4 defaults,nofail 0 2"

- name: Check whether the data disk is mounted
  ansible.builtin.command: "mountpoint -q {{ flintgraph_data_dir }}"
  register: data_mounted
  changed_when: false
  failed_when: false

# The mount module is in a collection that ansible-core does not include.
- name: Mount the data disk now  # noqa: command-instead-of-module
  ansible.builtin.command: "mount {{ flintgraph_data_dir }}"
  when: data_mounted.rc != 0
  changed_when: true

# Fixed folders rather than volumes k3s names at random, so that a replacement server, which
# starts with an empty cluster, finds the same data. The owners are the users their images run as.
- name: Create a folder for each service
  ansible.builtin.file:
    path: "{{ flintgraph_data_dir }}/{{ item.name }}"
    state: directory
    owner: "{{ item.owner }}"
    mode: "0700"
  loop:
    - {name: postgres, owner: "0"}
    - {name: minio, owner: "65532"}
    - {name: temporal, owner: "1000"}
  loop_control:
    label: "{{ item.name }}"
