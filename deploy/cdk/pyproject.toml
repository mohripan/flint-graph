[project]
name = "flintgraph-infra"
version = "0.1.0"
description = "The AWS resources for one small server and one sleeping GPU server (ADR 0077)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "aws-cdk-lib==2.275.0",
    "constructs>=10.4,<11",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
