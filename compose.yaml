services:
  api:
    build: .
    environment:
      ATLAS_ENV: local
      ATLAS_DATABASE_URL: postgresql+asyncpg://atlas:atlas@postgres:5432/atlas
      ATLAS_TEMPORAL_ADDRESS: temporal:7233
      ATLAS_NEO4J_URI: bolt://neo4j:7687
      ATLAS_NEO4J_USER: neo4j
      ATLAS_NEO4J_PASSWORD: atlaspassword
      ATLAS_NEO4J_DATABASE: neo4j
      ATLAS_OBJECT_STORE_PROVIDER: s3
      ATLAS_OBJECT_STORE_BUCKET: atlas-rag
      ATLAS_OBJECT_STORE_ENDPOINT_URL: http://minio:9000
      ATLAS_OBJECT_STORE_REGION: us-east-1
      ATLAS_OBJECT_STORE_ACCESS_KEY_ID: atlas
      ATLAS_OBJECT_STORE_SECRET_ACCESS_KEY: atlas-secret
      ATLAS_OBJECT_STORE_FORCE_PATH_STYLE: "true"
      ATLAS_OTEL_ENABLED: "true"
      ATLAS_OTEL_EXPORTER_OTLP_ENDPOINT: http://observability:4317
      ATLAS_OTEL_EXPORTER_OTLP_INSECURE: "true"
      ATLAS_OPENSEARCH_URL: http://opensearch:9200
      ATLAS_EMBEDDING_PROVIDER: deterministic
      ATLAS_QUERY_ANSWER_PROVIDER: deterministic
      ATLAS_QUERY_SUPPORT_PROVIDER: deterministic
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      observability:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      neo4j-migrate:
        condition: service_completed_successfully
      opensearch:
        condition: service_healthy

  outbox-relay:
    build: .
    command: ["python", "-m", "atlas_rag.processes.outbox_relay"]
    environment:
      ATLAS_ENV: local
      ATLAS_DATABASE_URL: postgresql+asyncpg://atlas:atlas@postgres:5432/atlas
      ATLAS_TEMPORAL_ADDRESS: temporal:7233
      ATLAS_OTEL_ENABLED: "false"
      ATLAS_EMBEDDING_PROVIDER: deterministic
      ATLAS_QUERY_ANSWER_PROVIDER: deterministic
      ATLAS_QUERY_SUPPORT_PROVIDER: deterministic
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_started

  ingestion-worker:
    build: .
    command: ["python", "-m", "atlas_rag.processes.ingestion_worker"]
    environment:
      ATLAS_ENV: local
      ATLAS_DATABASE_URL: postgresql+asyncpg://atlas:atlas@postgres:5432/atlas
      ATLAS_TEMPORAL_ADDRESS: temporal:7233
      ATLAS_NEO4J_URI: bolt://neo4j:7687
      ATLAS_NEO4J_USER: neo4j
      ATLAS_NEO4J_PASSWORD: atlaspassword
      ATLAS_NEO4J_DATABASE: neo4j
      ATLAS_OBJECT_STORE_PROVIDER: s3
      ATLAS_OBJECT_STORE_BUCKET: atlas-rag
      ATLAS_OBJECT_STORE_ENDPOINT_URL: http://minio:9000
      ATLAS_OBJECT_STORE_REGION: us-east-1
      ATLAS_OBJECT_STORE_ACCESS_KEY_ID: atlas
      ATLAS_OBJECT_STORE_SECRET_ACCESS_KEY: atlas-secret
      ATLAS_OBJECT_STORE_FORCE_PATH_STYLE: "true"
      ATLAS_PARSER_TIMEOUT_SECONDS: "30"
      ATLAS_PARSER_MAX_RAW_BYTES: "10485760"
      ATLAS_PARSER_MAX_NORMALIZED_BYTES: "5242880"
      ATLAS_PARSER_MAX_ELEMENTS: "10000"
      ATLAS_CHUNKING_MAX_CHUNK_CHARS: "1200"
      ATLAS_CHUNKING_OVERLAP_CHARS: "120"
      ATLAS_EXTRACTION_ENABLED: "true"
      ATLAS_EXTRACTION_MODE: optional
      ATLAS_LLM_PROVIDER: ${ATLAS_LLM_PROVIDER:-ollama}
      ATLAS_OLLAMA_BASE_URL: http://host.docker.internal:11434
      ATLAS_OLLAMA_MODEL: gemma3:1b
      ATLAS_EXTRACTION_TIMEOUT_SECONDS: "180"
      ATLAS_OTEL_ENABLED: "false"
      ATLAS_OPENSEARCH_URL: http://opensearch:9200
      ATLAS_EMBEDDING_PROVIDER: deterministic
      ATLAS_QUERY_ANSWER_PROVIDER: deterministic
      ATLAS_QUERY_SUPPORT_PROVIDER: deterministic
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      temporal:
        condition: service_started
      neo4j:
        condition: service_healthy
      neo4j-migrate:
        condition: service_completed_successfully
      opensearch:
        condition: service_healthy

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      ATLAS_DATABASE_URL: postgresql+asyncpg://atlas:atlas@postgres:5432/atlas
      ATLAS_OTEL_ENABLED: "false"
      ATLAS_EMBEDDING_PROVIDER: deterministic
      ATLAS_QUERY_ANSWER_PROVIDER: deterministic
      ATLAS_QUERY_SUPPORT_PROVIDER: deterministic
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: atlas
      MINIO_ROOT_PASSWORD: atlas-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      [
        "mc alias set local http://minio:9000 atlas atlas-secret && mc mb --ignore-existing local/atlas-rag",
      ]
    depends_on:
      minio:
        condition: service_healthy

  temporal:
    image: temporalio/temporal:latest
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--namespace", "default"]
    ports:
      - "7233:7233"
      - "8233:8233"

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/atlaspassword
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p atlaspassword 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - neo4j_data:/data

  neo4j-migrate:
    build: .
    command: ["python", "-m", "atlas_rag.processes.neo4j_migrate"]
    environment:
      ATLAS_NEO4J_URI: bolt://neo4j:7687
      ATLAS_NEO4J_USER: neo4j
      ATLAS_NEO4J_PASSWORD: atlaspassword
      ATLAS_NEO4J_DATABASE: neo4j
      ATLAS_OTEL_ENABLED: "false"
      ATLAS_EMBEDDING_PROVIDER: deterministic
      ATLAS_QUERY_ANSWER_PROVIDER: deterministic
      ATLAS_QUERY_SUPPORT_PROVIDER: deterministic
    depends_on:
      neo4j:
        condition: service_healthy

  opensearch:
    image: opensearchproject/opensearch:2.19.3
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: atlasOpenSearch1!
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    volumes:
      - opensearch_data:/usr/share/opensearch/data

  observability:
    image: grafana/otel-lgtm:0.28.0
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"
    healthcheck:
      test: ["CMD", "test", "-e", "/tmp/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - observability_data:/data

volumes:
  postgres_data:
  minio_data:
  neo4j_data:
  opensearch_data:
  observability_data:
