name: flint-graph

services:
  api:
    build: .
    environment:
      FLINT_GRAPH_ENV: local
      FLINT_GRAPH_DATABASE_URL: postgresql+asyncpg://flint_graph:flint_graph@postgres:5432/flint_graph
      FLINT_GRAPH_TEMPORAL_ADDRESS: temporal:7233
      FLINT_GRAPH_NEO4J_URI: bolt://neo4j:7687
      FLINT_GRAPH_NEO4J_USER: neo4j
      FLINT_GRAPH_NEO4J_PASSWORD: flintgraphpassword
      FLINT_GRAPH_NEO4J_DATABASE: neo4j
      FLINT_GRAPH_OBJECT_STORE_PROVIDER: s3
      FLINT_GRAPH_OBJECT_STORE_BUCKET: flint-graph
      FLINT_GRAPH_OBJECT_STORE_ENDPOINT_URL: http://minio:9000
      FLINT_GRAPH_OBJECT_STORE_REGION: us-east-1
      FLINT_GRAPH_OBJECT_STORE_ACCESS_KEY_ID: flint_graph
      FLINT_GRAPH_OBJECT_STORE_SECRET_ACCESS_KEY: flint-graph-secret
      FLINT_GRAPH_OBJECT_STORE_FORCE_PATH_STYLE: "true"
      FLINT_GRAPH_OTEL_ENABLED: "true"
      FLINT_GRAPH_OTEL_EXPORTER_OTLP_ENDPOINT: http://observability:4317
      FLINT_GRAPH_OTEL_EXPORTER_OTLP_INSECURE: "true"
      # Traces and metrics both push over OTLP locally, so the scrape endpoint is
      # off by default. Enable it (with a token) to use the `metrics` profile.
      FLINT_GRAPH_METRICS_ENABLED: ${FLINT_GRAPH_METRICS_ENABLED:-false}
      FLINT_GRAPH_METRICS_TOKEN: ${FLINT_GRAPH_METRICS_TOKEN:-}
      FLINT_GRAPH_USAGE_PRICING: ${FLINT_GRAPH_USAGE_PRICING:-{}}
      FLINT_GRAPH_OPENSEARCH_URL: http://opensearch:9200
      FLINT_GRAPH_EMBEDDING_PROVIDER: ${FLINT_GRAPH_EMBEDDING_PROVIDER:-deterministic}
      FLINT_GRAPH_EMBEDDING_MODEL: ${FLINT_GRAPH_EMBEDDING_MODEL:-deterministic-test}
      FLINT_GRAPH_EMBEDDING_DIMENSIONS: ${FLINT_GRAPH_EMBEDDING_DIMENSIONS:-384}
      FLINT_GRAPH_QUERY_ANSWER_PROVIDER: ${FLINT_GRAPH_QUERY_ANSWER_PROVIDER:-deterministic}
      FLINT_GRAPH_QUERY_ANSWER_MODEL: ${FLINT_GRAPH_QUERY_ANSWER_MODEL:-llama3.2}
      FLINT_GRAPH_QUERY_SUPPORT_PROVIDER: ${FLINT_GRAPH_QUERY_SUPPORT_PROVIDER:-deterministic}
      FLINT_GRAPH_QUERY_SUPPORT_MODEL: ${FLINT_GRAPH_QUERY_SUPPORT_MODEL:-llama3.2}
      FLINT_GRAPH_QUERY_ANSWER_TIMEOUT_SECONDS: ${FLINT_GRAPH_QUERY_ANSWER_TIMEOUT_SECONDS:-180}
      FLINT_GRAPH_QUERY_ANSWER_MAX_TOKENS: ${FLINT_GRAPH_QUERY_ANSWER_MAX_TOKENS:-1024}
      FLINT_GRAPH_QUERY_CONTEXT_TOKEN_BUDGET: ${FLINT_GRAPH_QUERY_CONTEXT_TOKEN_BUDGET:-4000}
      FLINT_GRAPH_QUERY_MAX_CONTEXT_RECORDS: ${FLINT_GRAPH_QUERY_MAX_CONTEXT_RECORDS:-25}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      observability:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      neo4j-migrate:
        condition: service_completed_successfully
      opensearch:
        condition: service_healthy

  outbox-relay:
    build: .
    command: ["python", "-m", "flint_graph.processes.outbox_relay"]
    environment:
      FLINT_GRAPH_ENV: local
      FLINT_GRAPH_DATABASE_URL: postgresql+asyncpg://flint_graph:flint_graph@postgres:5432/flint_graph
      FLINT_GRAPH_TEMPORAL_ADDRESS: temporal:7233
      FLINT_GRAPH_OTEL_ENABLED: "true"
      FLINT_GRAPH_OTEL_EXPORTER_OTLP_ENDPOINT: http://observability:4317
      FLINT_GRAPH_OTEL_EXPORTER_OTLP_INSECURE: "true"
      FLINT_GRAPH_EMBEDDING_PROVIDER: ${FLINT_GRAPH_EMBEDDING_PROVIDER:-deterministic}
      FLINT_GRAPH_EMBEDDING_MODEL: ${FLINT_GRAPH_EMBEDDING_MODEL:-deterministic-test}
      FLINT_GRAPH_EMBEDDING_DIMENSIONS: ${FLINT_GRAPH_EMBEDDING_DIMENSIONS:-384}
      FLINT_GRAPH_QUERY_ANSWER_PROVIDER: ${FLINT_GRAPH_QUERY_ANSWER_PROVIDER:-deterministic}
      FLINT_GRAPH_QUERY_ANSWER_MODEL: ${FLINT_GRAPH_QUERY_ANSWER_MODEL:-llama3.2}
      FLINT_GRAPH_QUERY_SUPPORT_PROVIDER: ${FLINT_GRAPH_QUERY_SUPPORT_PROVIDER:-deterministic}
      FLINT_GRAPH_QUERY_SUPPORT_MODEL: ${FLINT_GRAPH_QUERY_SUPPORT_MODEL:-llama3.2}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_started

  ingestion-worker:
    build: .
    command: ["python", "-m", "flint_graph.processes.ingestion_worker"]
    environment:
      FLINT_GRAPH_ENV: local
      FLINT_GRAPH_DATABASE_URL: postgresql+asyncpg://flint_graph:flint_graph@postgres:5432/flint_graph
      FLINT_GRAPH_TEMPORAL_ADDRESS: temporal:7233
      FLINT_GRAPH_NEO4J_URI: bolt://neo4j:7687
      FLINT_GRAPH_NEO4J_USER: neo4j
      FLINT_GRAPH_NEO4J_PASSWORD: flintgraphpassword
      FLINT_GRAPH_NEO4J_DATABASE: neo4j
      FLINT_GRAPH_OBJECT_STORE_PROVIDER: s3
      FLINT_GRAPH_OBJECT_STORE_BUCKET: flint-graph
      FLINT_GRAPH_OBJECT_STORE_ENDPOINT_URL: http://minio:9000
      FLINT_GRAPH_OBJECT_STORE_REGION: us-east-1
      FLINT_GRAPH_OBJECT_STORE_ACCESS_KEY_ID: flint_graph
      FLINT_GRAPH_OBJECT_STORE_SECRET_ACCESS_KEY: flint-graph-secret
      FLINT_GRAPH_OBJECT_STORE_FORCE_PATH_STYLE: "true"
      FLINT_GRAPH_PARSER_TIMEOUT_SECONDS: "30"
      FLINT_GRAPH_PARSER_MAX_RAW_BYTES: "10485760"
      FLINT_GRAPH_PARSER_MAX_NORMALIZED_BYTES: "5242880"
      FLINT_GRAPH_PARSER_MAX_ELEMENTS: "10000"
      FLINT_GRAPH_CHUNKING_MAX_CHUNK_CHARS: "1200"
      FLINT_GRAPH_CHUNKING_OVERLAP_CHARS: "120"
      FLINT_GRAPH_EXTRACTION_ENABLED: "true"
      FLINT_GRAPH_EXTRACTION_MODE: optional
      FLINT_GRAPH_LLM_PROVIDER: ${FLINT_GRAPH_LLM_PROVIDER:-ollama}
      FLINT_GRAPH_OLLAMA_BASE_URL: http://host.docker.internal:11434
      FLINT_GRAPH_OLLAMA_MODEL: gemma3:1b
      FLINT_GRAPH_EXTRACTION_TIMEOUT_SECONDS: "180"
      FLINT_GRAPH_OTEL_ENABLED: "true"
      FLINT_GRAPH_OTEL_EXPORTER_OTLP_ENDPOINT: http://observability:4317
      FLINT_GRAPH_OTEL_EXPORTER_OTLP_INSECURE: "true"
      FLINT_GRAPH_OPENSEARCH_URL: http://opensearch:9200
      FLINT_GRAPH_EMBEDDING_PROVIDER: ${FLINT_GRAPH_EMBEDDING_PROVIDER:-deterministic}
      FLINT_GRAPH_EMBEDDING_MODEL: ${FLINT_GRAPH_EMBEDDING_MODEL:-deterministic-test}
      FLINT_GRAPH_EMBEDDING_DIMENSIONS: ${FLINT_GRAPH_EMBEDDING_DIMENSIONS:-384}
      FLINT_GRAPH_QUERY_ANSWER_PROVIDER: ${FLINT_GRAPH_QUERY_ANSWER_PROVIDER:-deterministic}
      FLINT_GRAPH_QUERY_ANSWER_MODEL: ${FLINT_GRAPH_QUERY_ANSWER_MODEL:-llama3.2}
      FLINT_GRAPH_QUERY_SUPPORT_PROVIDER: ${FLINT_GRAPH_QUERY_SUPPORT_PROVIDER:-deterministic}
      FLINT_GRAPH_QUERY_SUPPORT_MODEL: ${FLINT_GRAPH_QUERY_SUPPORT_MODEL:-llama3.2}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      temporal:
        condition: service_started
      neo4j:
        condition: service_healthy
      neo4j-migrate:
        condition: service_completed_successfully
      opensearch:
        condition: service_healthy

  projection-cleanup:
    build: .
    command: ["python", "-m", "flint_graph.processes.document_projection_cleanup"]
    environment:
      FLINT_GRAPH_ENV: local
      FLINT_GRAPH_DATABASE_URL: postgresql+asyncpg://flint_graph:flint_graph@postgres:5432/flint_graph
      FLINT_GRAPH_NEO4J_URI: bolt://neo4j:7687
      FLINT_GRAPH_NEO4J_USER: neo4j
      FLINT_GRAPH_NEO4J_PASSWORD: flintgraphpassword
      FLINT_GRAPH_NEO4J_DATABASE: neo4j
      FLINT_GRAPH_OPENSEARCH_URL: http://opensearch:9200
      FLINT_GRAPH_OTEL_ENABLED: "true"
      FLINT_GRAPH_OTEL_EXPORTER_OTLP_ENDPOINT: http://observability:4317
      FLINT_GRAPH_OTEL_EXPORTER_OTLP_INSECURE: "true"
      FLINT_GRAPH_EMBEDDING_PROVIDER: deterministic
      FLINT_GRAPH_QUERY_ANSWER_PROVIDER: deterministic
      FLINT_GRAPH_QUERY_SUPPORT_PROVIDER: deterministic
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy
      neo4j-migrate:
        condition: service_completed_successfully
      opensearch:
        condition: service_healthy

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      FLINT_GRAPH_DATABASE_URL: postgresql+asyncpg://flint_graph:flint_graph@postgres:5432/flint_graph
      FLINT_GRAPH_OTEL_ENABLED: "false"
      FLINT_GRAPH_EMBEDDING_PROVIDER: deterministic
      FLINT_GRAPH_QUERY_ANSWER_PROVIDER: deterministic
      FLINT_GRAPH_QUERY_SUPPORT_PROVIDER: deterministic
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_DB: flint_graph
      POSTGRES_USER: flint_graph
      POSTGRES_PASSWORD: flint_graph
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flint_graph -d flint_graph"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: flint_graph
      MINIO_ROOT_PASSWORD: flint-graph-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      [
        "mc alias set local http://minio:9000 flint_graph flint-graph-secret && mc mb --ignore-existing local/flint-graph",
      ]
    depends_on:
      minio:
        condition: service_healthy

  temporal:
    image: temporalio/temporal:latest
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--namespace", "default"]
    ports:
      - "7233:7233"
      - "8233:8233"

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/flintgraphpassword
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -a bolt://localhost:7687 -u neo4j -p flintgraphpassword 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 20s
      start_period: 60s
      retries: 30
    volumes:
      - neo4j_data:/data

  neo4j-migrate:
    build: .
    command: ["python", "-m", "flint_graph.processes.neo4j_migrate"]
    environment:
      FLINT_GRAPH_NEO4J_URI: bolt://neo4j:7687
      FLINT_GRAPH_NEO4J_USER: neo4j
      FLINT_GRAPH_NEO4J_PASSWORD: flintgraphpassword
      FLINT_GRAPH_NEO4J_DATABASE: neo4j
      FLINT_GRAPH_OTEL_ENABLED: "false"
      FLINT_GRAPH_EMBEDDING_PROVIDER: deterministic
      FLINT_GRAPH_QUERY_ANSWER_PROVIDER: deterministic
      FLINT_GRAPH_QUERY_SUPPORT_PROVIDER: deterministic
    depends_on:
      neo4j:
        condition: service_healthy

  opensearch:
    image: opensearchproject/opensearch:2.19.3
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: FlintGraphOpenSearch1!
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    volumes:
      - opensearch_data:/usr/share/opensearch/data

  observability:
    image: grafana/otel-lgtm:0.28.0
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"
    healthcheck:
      test: ["CMD", "test", "-e", "/tmp/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - observability_data:/data
      - ./ops/observability/grafana/provisioning/dashboards/flint-graph.yml:/otel-lgtm/grafana/conf/provisioning/dashboards/flint-graph.yml:ro
      - ./ops/observability/grafana/provisioning/datasources/flint-graph.yml:/otel-lgtm/grafana/conf/provisioning/datasources/flint-graph.yml:ro
      - ./ops/observability/grafana-dashboard.json:/etc/flint-graph/dashboards/flint-graph-operations.json:ro

  # Opt-in scrape path for rehearsing a deployment that pulls metrics instead of
  # receiving them over OTLP. Requires the API to be started with
  # FLINT_GRAPH_METRICS_ENABLED=true and FLINT_GRAPH_METRICS_TOKEN set:
  #   docker compose --profile metrics up -d
  prometheus:
    profiles: ["metrics"]
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
    ports:
      - "127.0.0.1:9090:9090"
    environment:
      FLINT_GRAPH_METRICS_TOKEN: ${FLINT_GRAPH_METRICS_TOKEN:-}
    volumes:
      - ./ops/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_started
      alertmanager:
        condition: service_started

  alertmanager:
    profiles: ["metrics"]
    image: prom/alertmanager:v0.34.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --data.retention=120h
      # This is one local instance, not a production HA cluster.
      - --cluster.listen-address=
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./ops/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager

volumes:
  alertmanager_data:
  prometheus_data:
  postgres_data:
  minio_data:
  neo4j_data:
  opensearch_data:
  observability_data:
