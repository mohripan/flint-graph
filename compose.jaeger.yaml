# Local backend only. Gateway fan-out and application switching are separate deliveries.
# docker compose -f compose.yaml -f compose.jaeger.yaml --profile jaeger up -d --no-deps jaeger
services:
  jaeger:
    profiles: ["jaeger"]
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.22.0@sha256:836b967b5abcf1f7758066aa6b348619267a2f1459f72d472840570f9bd88a17
    command: ["--config=/etc/jaeger/config.yml"]
    ports:
      - "127.0.0.1:16686:16686"
    volumes:
      - ./ops/observability/jaeger.yml:/etc/jaeger/config.yml:ro
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:13133/health/status"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
