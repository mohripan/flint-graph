name: Live Eval

'on':
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

jobs:
  live-claude-eval:
    runs-on: ubuntu-latest
    if: ${{ vars.FLINT_GRAPH_RUN_LIVE_EVAL == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Require live eval recording
        run: |
          test -n "$ANTHROPIC_API_KEY"
          test -f "$FLINT_GRAPH_LIVE_EVAL_RECORDINGS"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FLINT_GRAPH_LIVE_EVAL_RECORDINGS: ${{ vars.FLINT_GRAPH_LIVE_EVAL_RECORDINGS || 'evals/reports/acme-smoke/live-claude-recorded.jsonl' }}
      - name: Gate live-claude eval
        run: >
          uv run flint-graph-eval run
          --dataset evals/datasets/acme-smoke
          --evaluations "$FLINT_GRAPH_LIVE_EVAL_RECORDINGS"
          --experiment evals/experiments/acme-smoke.yaml
          --baseline evals/reports/acme-smoke/baselines.json
          --config-name live-claude
          --report evals/reports/acme-smoke/live-claude-latest.json
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FLINT_GRAPH_LIVE_EVAL_RECORDINGS: ${{ vars.FLINT_GRAPH_LIVE_EVAL_RECORDINGS || 'evals/reports/acme-smoke/live-claude-recorded.jsonl' }}
