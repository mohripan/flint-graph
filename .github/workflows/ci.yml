name: CI

'on':
  pull_request:
  push:
    branches: [master, main]

jobs:
  offline-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Lint
        run: uv run ruff check .
      - name: Typecheck
        run: uv run mypy
      - name: Tests
        run: uv run pytest
      - name: Offline migration SQL
        run: uv run alembic upgrade head --sql > /dev/null
        env:
          FLINT_GRAPH_QUERY_ANSWER_PROVIDER: deterministic
          FLINT_GRAPH_QUERY_SUPPORT_PROVIDER: deterministic
      - name: Compose config
        run: |
          docker compose config > /dev/null
          docker compose --profile metrics config > /dev/null
          docker compose -f compose.yaml -f compose.ai-observability.yaml --profile ai-observability config > /dev/null
          docker compose -f compose.yaml -f compose.ai-observability.yaml --profile ai-observability --profile metrics config > /dev/null
          docker compose -f compose.yaml -f compose.offline.yaml config > /dev/null
          docker compose -f compose.yaml -f compose.offline.yaml -f compose.ai-observability.yaml --profile ai-observability config > /dev/null
          docker compose -f compose.yaml -f compose.local-real.yaml config > /dev/null
          docker compose -f compose.yaml -f compose.local-real.yaml -f compose.ai-observability.yaml --profile ai-observability config > /dev/null
        env:
          FLINT_GRAPH_LOCAL_EMBEDDING_MODEL: fixture-embedding:1
          FLINT_GRAPH_LOCAL_EMBEDDING_DIMENSIONS: '768'
          FLINT_GRAPH_LOCAL_ANSWER_MODEL: fixture-answer:1
          FLINT_GRAPH_LOCAL_SUPPORT_MODEL: fixture-answer:1
      - name: Offline deterministic eval gate
        run: >
          uv run flint-graph-eval run
          --dataset evals/datasets/acme-smoke
          --evaluations evals/reports/acme-smoke/deterministic-recorded.jsonl
          --experiment evals/experiments/acme-smoke.yaml
          --baseline evals/reports/acme-smoke/baselines.json
          --config-name deterministic

  observability-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install locked test dependencies
        run: uv sync --all-groups --locked
      - name: Validate pinned native configurations
        run: |
          docker compose --profile metrics run --rm --no-deps --entrypoint promtool prometheus check config /etc/prometheus/prometheus.yml
          docker compose --profile metrics run --rm --no-deps --entrypoint amtool alertmanager check-config /etc/alertmanager/alertmanager.yml
          docker compose -f compose.yaml -f compose.ai-observability.yaml --profile ai-observability run --rm --no-deps otel-gateway validate --config=/etc/otelcol/config.yml
      - name: Reject semantically invalid YAML fixtures
        run: |
          if docker run --rm -v "$PWD/tests/fixtures/observability:/invalid:ro" --entrypoint promtool prom/prometheus:v3.1.0 check rules /invalid/invalid-alerts.yml; then
            echo "promtool accepted invalid rules"
            exit 1
          fi
          if docker run --rm -v "$PWD/tests/fixtures/observability:/invalid:ro" --entrypoint amtool prom/alertmanager:v0.34.1 check-config /invalid/invalid-alertmanager.yml; then
            echo "amtool accepted an invalid route"
            exit 1
          fi
          if docker run --rm -v "$PWD/tests/fixtures/observability:/invalid:ro" otel/opentelemetry-collector-contrib:0.162.0 validate --config=/invalid/invalid-collector.yml; then
            echo "Collector accepted an unknown component"
            exit 1
          fi
      - name: Start isolated local telemetry backends
        run: |
          docker compose -f compose.yaml -f compose.ai-observability.yaml --profile ai-observability up -d --no-deps --wait --wait-timeout 180 observability phoenix otel-gateway
      - name: Check real trace fan-out and content privacy without inference
        run: uv run pytest tests/integration/test_ai_observability_live.py -q
        env:
          FLINT_GRAPH_AI_OBSERVABILITY_INTEGRATION: '1'
      - name: Diagnostics on failure
        if: failure()
        run: docker compose -f compose.yaml -f compose.ai-observability.yaml --profile ai-observability logs --tail 100 observability phoenix otel-gateway

  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Outcome tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
