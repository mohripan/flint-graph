name: CI

'on':
  pull_request:
  push:
    branches: [master, main]

jobs:
  offline-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Lint
        run: uv run ruff check .
      - name: Typecheck
        run: uv run mypy
      - name: Tests
        run: uv run pytest
      - name: Offline migration SQL
        run: uv run alembic upgrade head --sql > /dev/null
        env:
          FLINT_GRAPH_QUERY_ANSWER_PROVIDER: deterministic
          FLINT_GRAPH_QUERY_SUPPORT_PROVIDER: deterministic
      - name: Compose config
        run: |
          docker compose config > /dev/null
          docker compose --profile metrics config > /dev/null
      - name: Offline deterministic eval gate
        run: >
          uv run flint-graph-eval run
          --dataset evals/datasets/acme-smoke
          --evaluations evals/reports/acme-smoke/deterministic-recorded.jsonl
          --experiment evals/experiments/acme-smoke.yaml
          --baseline evals/reports/acme-smoke/baselines.json
          --config-name deterministic

  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Outcome tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
