name: Deploy Runpod images

# Run by hand. Builds the two images Runpod runs and publishes them under this commit's hash. They
# change rarely and the generation image is large, so they are not part of "Deploy images". Nothing
# uses them until the Runpod endpoints name that hash: see docs/runbooks/aws-deployment.md.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: flint-graph-runpod-generation
            dockerfile: ops/deploy/runpod-generation.Dockerfile
          - image: flint-graph-runpod-assistant
            dockerfile: ops/deploy/runpod-assistant.Dockerfile
    steps:
      - name: Make room for the runtimes
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          # Runpod's machines are all this.
          platforms: linux/amd64
          tags: ghcr.io/mohripan/${{ matrix.image }}:${{ github.sha }}
