# Local only. Layer after compose.jaeger.yaml and, optionally, AI observability.
# Use FLINT_GRAPH_JAEGER_GATEWAY_MODE=jaeger-phoenix explicitly for all three.
services:
  api:
    environment:
      FLINT_GRAPH_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-gateway:4317
  outbox-relay:
    environment:
      FLINT_GRAPH_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-gateway:4317
  ingestion-worker:
    environment:
      FLINT_GRAPH_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-gateway:4317
  projection-cleanup:
    environment:
      FLINT_GRAPH_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-gateway:4317
  observability:
    volumes:
      - ./ops/observability/grafana/provisioning/datasources/jaeger.yml:/otel-lgtm/grafana/conf/provisioning/datasources/jaeger.yml:ro
  otel-gateway:
    profiles: ["jaeger"]
    image: otel/opentelemetry-collector-contrib:0.162.0
    command:
      - --config=/etc/otelcol/config.yml
      - --config=/etc/otelcol/jaeger-exporter.yml
      - --config=/etc/otelcol/${FLINT_GRAPH_JAEGER_GATEWAY_MODE:-jaeger-only}.yml
    ports:
      - "127.0.0.1:14317:4317"
      - "127.0.0.1:18888:8888"
    volumes:
      - ./ops/observability/otel-gateway.yml:/etc/otelcol/config.yml:ro
      - ./ops/observability/otel-jaeger-exporter.yml:/etc/otelcol/jaeger-exporter.yml:ro
      - ./ops/observability/otel-jaeger-only.yml:/etc/otelcol/jaeger-only.yml:ro
      - ./ops/observability/otel-jaeger-phoenix.yml:/etc/otelcol/jaeger-phoenix.yml:ro
    mem_limit: 768m
    depends_on:
      observability:
        condition: service_healthy
      jaeger:
        condition: service_healthy
