[project]
name = "flint-graph-voicegen-qwen3"
version = "0.1.0"
description = "Isolated local Qwen3-TTS voice child for FlintGraph narrative assets (ADR 0045)"
requires-python = "==3.11.*"
dependencies = [
    "qwen-tts==0.1.1",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "numpy",
    "nvidia-ml-py==13.615.71",
]

[tool.uv]
package = false
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]
# The web demo is never used.
override-dependencies = ["gradio; sys_platform == 'never'"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
