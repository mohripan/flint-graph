[project]
name = "flint-graph-voicegen"
version = "0.1.0"
description = "Isolated local voice-generation child for FlintGraph narrative assets"
requires-python = "==3.12.*"
dependencies = [
    "torch==2.11.0",
    "kokoro==0.9.4",
    "misaki[en]==0.9.4",
    "en-core-web-sm==3.8.0",
    "numpy",
]

[tool.uv]
package = false
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]

[tool.uv.sources]
# CPU wheels: Kokoro-82M is fast enough on the CPU and never competes for the GPU.
torch = { index = "pytorch-cpu" }
# spaCy would download this model at first use; the lock pins it instead.
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
