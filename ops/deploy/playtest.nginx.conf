# The same headers as tools/narrative/serve_preview.py. __PARENT_ORIGIN__ is set when the image is built.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip_static on;

    add_header Cache-Control "no-cache" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors __PARENT_ORIGIN__" always;

    location / {
        limit_except GET { deny all; }
        # This address has no use for credentials, and never keeps any by mistake.
        if ($http_authorization) { return 403; }
        if ($http_cookie) { return 403; }
        try_files $uri =404;
    }
}
