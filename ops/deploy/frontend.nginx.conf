server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml font/ttf;

    # Vite puts a content hash in these names, so they can be kept forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Every other path is a page of the app, and must be asked for again after a deployment.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
