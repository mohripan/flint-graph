          "template": "Extract structured facts and relationship claims from the document chunks.\nRules:\n- summary is a short non-empty string describing the document.\n- Each entity has a non-empty name and a type from: person, organization, place, concept, other.\n- Each claim is a (subject, predicate, object) triple.\n- subject, predicate, and object must each be a single non-empty string; never use null or a list.\n- evidence_chunk_ids is a list of the bracketed chunk ids that support the claim.\nReturn only JSON matching this schema:\n{\n  \"claims\": [\n    {\n      \"evidence_chunk_ids\": [\n        \"string\"\n      ],\n      \"object\": \"string\",\n      \"predicate\": \"string\",\n      \"subject\": \"string\"\n    }\n  ],\n  \"entities\": [\n    {\n      \"name\": \"string\",\n      \"type\": \"person|organization|place|concept|other\"\n    }\n  ],\n  \"summary\": \"string\",\n  \"title\": \"string|null\",\n  \"topics\": [\n    \"string\"\n  ]\n}\nDocument chunks:\n{{chunks}}",
